# Conda environment for RiboMamba.
#   Create it:  conda env create -f environment.yml
#   Update it:  conda env update -f environment.yml
#   Use it:     conda activate ribomamba
# Why each line is here: docs/DECISIONS.md, D-003 (conda) and D-004 (PyTorch).
name: ribomamba
channels:
  - conda-forge   # main community channel; listed first = highest priority
  - bioconda      # bioinformatics packages (ViennaRNA, MMseqs2); built on top of conda-forge
dependencies:
  - python=3.12   # mature release, supported by PyTorch, mamba-ssm and ViennaRNA builds
  - viennarna=2.7.2  # RNA folding (RNAfold, "import RNA"). Exact pin: it is our
                     # evaluation oracle, and another version may give other energies.
  - mmseqs2=18.8cc5c   # fast sequence search; used for the train/test leakage audit
  - infernal=1.1.5     # covariance-model (structure-aware) search; Rfam's own tool (D-009)
  - eternafold=1.3.1   # second, independent folding oracle: parameters learned from Eterna's
                       # chemical-mapping experiments, not Turner's tables (Phase 3, D-013)
  - polars=1.44        # fast table processing (20 M Rfam rows in seconds, low memory)
  - huggingface_hub=1.9  # downloads dataset files from the HuggingFace Hub at a pinned revision
  - numpy=2.5
  - pytest=9.1         # runs the tests in tests/
  - pip
  - pip:
      # PyTorch from PyTorch's own package index, built against CUDA 12.8.
      # Pinned to 2.10 because it is the newest version that mamba-ssm and
      # causal-conv1d (Phase 4) ship prebuilt wheels for (D-004).
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      # Mamba (Phase 4). These contain compiled CUDA kernels, and PyPI has only source
      # archives: pip would try to compile them, which fails here because the environment has
      # PyTorch's CUDA runtime but no CUDA compiler (nvcc). So we install the authors' prebuilt
      # wheels from their GitHub releases, choosing the one matching this stack exactly:
      # CUDA 12, torch 2.10, C++11 ABI true, CPython 3.12, x86_64 (the reason torch is pinned
      # to 2.10, D-004). Verified working on the RTX 4060 under WSL2 (session 04).
      - https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl
      - https://github.com/state-spaces/mamba/releases/download/v2.3.2.post1/mamba_ssm-2.3.2.post1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl
      - -e .             # this repository's own code (ribomamba/), "editable" (see pyproject.toml)
