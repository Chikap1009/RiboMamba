# Conda environment for RiboMamba.
#   Create it:  conda env create -f environment.yml
#   Use it:     conda activate ribomamba
# Why each line is here: docs/DECISIONS.md, D-003.
name: ribomamba
channels:
  - conda-forge   # main community channel; listed first = highest priority
  - bioconda      # bioinformatics packages (ViennaRNA); built on top of conda-forge
dependencies:
  - python=3.12   # mature release, supported by PyTorch, mamba-ssm and ViennaRNA builds
  - viennarna=2.7.2  # RNA folding (RNAfold, "import RNA"). Exact pin: it is our
                     # evaluation oracle, and another version may give other energies.
