name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install 'numpy>=2,<3' 'pytest>=8,<10'
      - name: Check tokenizer and statistics
        run: python -m pytest -q tests/test_tokenizer.py tests/test_stats.py
      - name: Validate aggregate result JSON
        run: python -m json.tool docs/results/final_v2_summary.json > /dev/null
